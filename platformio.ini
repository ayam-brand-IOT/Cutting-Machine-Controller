[env:waveshare_esp32s3_eth]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

upload_speed  = 921600
monitor_speed = 115200
monitor_raw = yes

upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101


board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv

; eModbus is vendored (RTU-only) in lib/eModbus to avoid the registry package's
; TCP/Ethernet/AsyncTCP transitive deps, which don't resolve on this toolchain.
; The Waveshare8DI8DO driver lives in lib/waveshare-8DI-8DO and is auto-linked.
; chain LDF = follow real #includes only (don't deep-scan unused headers).
lib_ldf_mode = chain

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -DCORE_DEBUG_LEVEL=0